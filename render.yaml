services:
  - type: web
    name: hostel-portal-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: hostel-portal-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    rootDir: backend
